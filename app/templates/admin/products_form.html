{% extends "base.html" %}

{% block title %}
    {% if product %}
        Edit Product
    {% else %}
        Add New Product
    {% endif %}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <h2 class="mb-4">
            {{ "Edit Product" if product else "Add New Product" }}
        </h2>

        <div id="alert-container"></div>

        <form id="product-form">

            <div class="mb-3">
                <label class="form-label" for="name">
                    Product Name *
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    class="form-control"
                    value="{{ product.name if product else '' }}"
                    required
                >
            </div>

            <div class="mb-3">

                <label class="form-label" for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    class="form-control"
                >{{ product.description if product else '' }}</textarea>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label" for="price">
                        Price *
                    </label>

                    <input
                        id="price"
                        name="price"
                        type="number"
                        min="0"
                        step="0.01"
                        class="form-control"
                        value="{{ '%.2f'|format(product.price) if product else '' }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label" for="category_id">
                        Category *
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                    </select>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label" for="image_url">

                    Image URL

                </label>

                <input
                    id="image_url"
                    name="image_url"
                    type="url"
                    class="form-control"
                    value="{{ product.image_url if product else '' }}"
                >

            </div>

            <div class="mb-4">

                <label class="form-label" for="metadata_json">

                    Metadata (JSON)

                </label>

                <textarea
                    id="metadata_json"
                    name="metadata_json"
                    rows="5"
                    class="form-control"
                    placeholder='{"brand":"Nike","color":"Black"}'
                >{{ product.metadata_json | tojson if product and product.metadata_json else '' }}</textarea>

                <div class="form-text">

                    Leave empty if not required.

                </div>

            </div>

            <button
                id="save-btn"
                type="submit"
                class="btn btn-primary"
            >

                Save Product

            </button>

            <a
                href="/admin/products"
                class="btn btn-secondary"
            >

                Cancel

            </a>

        </form>

    </div>

</div>

<script>

const productId = "{{ product.id if product else '' }}";
const selectedCategory = "{{ product.category_id if product else '' }}";

function showAlert(message, type = "danger") {

    document.getElementById("alert-container").innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show">

            ${message}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>
    `;
}

async function loadCategories() {

    const token = localStorage.getItem("access_token");

    if (!token) {

        showAlert("Please login again.");

        return;
    }

    try {

        const response = await fetch("/admin/api/categories", {

            headers: {

                "Authorization": `Bearer ${token}`

            }

        });

        if (response.status === 401) {

            showAlert("Session expired. Please login again.");

            return;
        }

        if (!response.ok) {

            throw new Error("Unable to load categories.");

        }

        const categories = await response.json();

        const select = document.getElementById("category_id");

        categories.forEach(category => {

            const option = document.createElement("option");

            option.value = category.id;

            option.textContent = category.name;

            if (String(category.id) === String(selectedCategory)) {

                option.selected = true;

            }

            select.appendChild(option);

        });

    }

    catch (error) {

        console.error(error);

        showAlert(error.message);

    }

}

async function saveProduct(event) {

    event.preventDefault();

    const saveButton = document.getElementById("save-btn");

    saveButton.disabled = true;

    saveButton.innerHTML = "Saving...";

    const form = document.getElementById("product-form");

    let metadata = null;

    if (form.metadata_json.value.trim() !== "") {

        try {

            metadata = JSON.parse(form.metadata_json.value);

        }

        catch {

            showAlert("Metadata must be valid JSON.");

            saveButton.disabled = false;

            saveButton.innerHTML = "Save Product";

            return;

        }

    }

    const payload = {

        name: form.name.value.trim(),

        description: form.description.value.trim() || null,

        price: parseFloat(form.price.value),

        category_id: parseInt(form.category_id.value),

        image_url: form.image_url.value.trim() || null,

        metadata_json: metadata

    };

    const token = localStorage.getItem("access_token");

    const url = productId

        ? `/admin/api/products/${productId}`

        : "/admin/api/products";

    const method = productId ? "PUT" : "POST";

    try {

        const response = await fetch(url, {

            method,

            headers: {

                "Content-Type": "application/json",

                "Authorization": `Bearer ${token}`

            },

            body: JSON.stringify(payload)

        });

        if (response.ok) {

            window.location.href =
                "/admin/products?msg=Product+saved+successfully";

            return;

        }

        let errorMessage = "Unable to save product.";

        try {

            const err = await response.json();

            errorMessage = err.detail || errorMessage;

        }

        catch {}

        showAlert(errorMessage);

    }

    catch (error) {

        console.error(error);

        showAlert("Network error. Please try again.");

    }

    finally {

        saveButton.disabled = false;

        saveButton.innerHTML = "Save Product";

    }

}

document
    .getElementById("product-form")
    .addEventListener("submit", saveProduct);

loadCategories();

</script>

{% endblock %}
